    <meta name="theme-color" content="#0B0F14" />
    <script>
      // Apply the stored/system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.add(theme);
          root.classList.remove(theme === 'dark' ? 'light' : 'dark');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0B0F14' : '#F7F6F2');
          }
        } catch (error) {
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var fallback = prefersDark ? 'dark' : 'light';
          document.documentElement.classList.add(fallback);
          document.documentElement.style.colorScheme = fallback;
        }
      })();
    </script>
